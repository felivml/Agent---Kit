<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapcn Interactive Demo - Beautiful Maps Made Simple</title>
  
  <!-- MapLibre GL CSS & JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Floating Glass Header */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .brand-pill {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .brand-badge {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      color: white;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 9999px;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Controls Panel */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      width: 320px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }

    .theme-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 8px 6px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .theme-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .city-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .city-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .city-btn:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      transform: translateX(4px);
    }

    /* Pulse Markers */
    .pulse-marker {
      position: relative;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.4);
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .pulse-dot {
      position: relative;
      width: 12px;
      height: 12px;
      background: #3b82f6;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
    }

    @keyframes ping {
      75%, 100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    /* Custom MapLibre Popups */
    .maplibregl-popup-content {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 16px !important;
      padding: 16px !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7) !important;
    }

    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
      border-top-color: #0f172a !important;
    }
    
    .maplibregl-popup-close-button {
      color: #94a3b8 !important;
      padding: 4px 8px !important;
      font-size: 1.1rem !important;
    }

    .popup-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .popup-desc {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .popup-tag {
      display: inline-block;
      margin-top: 8px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .back-btn {
      pointer-events: auto;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Floating Top Bar -->
  <header class="top-bar">
    <div class="brand-pill">
      <span class="brand-badge">MAPCN</span>
      <span class="brand-title">Mapas Vectoriales Interactivos (60 FPS)</span>
    </div>
    <a href="../index.html" class="back-btn">← Volver al Hub</a>
  </header>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Floating Controls Panel -->
  <div class="controls-panel">
    <div class="panel-title">Estilo de Mapa</div>
    <div class="btn-group">
      <button class="theme-btn active" onclick="changeStyle('dark')">🌙 Dark</button>
      <button class="theme-btn" onclick="changeStyle('light')">☀️ Light</button>
      <button class="theme-btn" onclick="changeStyle('voyager')">🗺️ Voyager</button>
    </div>

    <div class="panel-title">Volar a Ciudad</div>
    <div class="city-list">
      <button class="city-btn" onclick="flyToCity([-74.0721, 4.7110], 12)">
        <span>🇨🇴 Bogotá, Colombia</span>
        <span style="color:#60a5fa;">Sede</span>
      </button>
      <button class="city-btn" onclick="flyToCity([-75.5636, 6.2518], 12)">
        <span>🇨🇴 Medellín</span>
        <span style="color:#94a3b8;">Hub Tech</span>
      </button>
      <button class="city-btn" onclick="flyToCity([-122.4194, 37.7749], 12)">
        <span>🇺🇸 San Francisco</span>
        <span style="color:#94a3b8;">Silicon V.</span>
      </button>
      <button class="city-btn" onclick="flyToCity([2.3522, 48.8566], 12)">
        <span>🇫🇷 París</span>
        <span style="color:#94a3b8;">Europa</span>
      </button>
    </div>
  </div>

  <script>
    const STYLES = {
      dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      voyager: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json'
    };

    // Initialize MapLibre GL
    const map = new maplibregl.Map({
      container: 'map',
      style: STYLES.dark,
      center: [-74.0721, 4.7110], // Bogotá
      zoom: 11.5,
      pitch: 45, // 3D Pitch angle
      bearing: -17.6,
      antialias: true
    });

    // Add Navigation Controls (Zoom, Compass)
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.FullscreenControl(), 'top-right');

    // Locations Data
    const LOCATIONS = [
      {
        name: "Sede Central Bogotá",
        coords: [-74.0721, 4.7110],
        desc: "Centro de operaciones principales y desarrollo de software con agentes de IA.",
        tag: "Principal • Operativo"
      },
      {
        name: "Hub de Innovación Medellín",
        coords: [-75.5636, 6.2518],
        desc: "Ruta N y ecosistema de desarrollo Full-Stack e investigación de modelos.",
        tag: "Innovación • Dev"
      },
      {
        name: "Silicon Valley Lab",
        coords: [-122.4194, 37.7749],
        desc: "Conexión de APIs y sincronización con infraestructuras cloud globales.",
        tag: "Global • Cloud"
      },
      {
        name: "Paris Design Node",
        coords: [2.3522, 48.8566],
        desc: "Dirección de arte, sistemas de diseño y tipografía de alta fidelidad.",
        tag: "Design • Art"
      }
    ];

    // Add Markers on Load
    map.on('load', () => {
      LOCATIONS.forEach(loc => {
        // Create custom HTML marker element
        const el = document.createElement('div');
        el.className = 'pulse-marker';
        el.innerHTML = `
          <div class="pulse-ring"></div>
          <div class="pulse-dot"></div>
        `;

        // Create Popup
        const popup = new maplibregl.Popup({ offset: 25 }).setHTML(`
          <div class="popup-title">${loc.name}</div>
          <div class="popup-desc">${loc.desc}</div>
          <span class="popup-tag">${loc.tag}</span>
        `);

        new maplibregl.Marker({ element: el })
          .setLngLat(loc.coords)
          .setPopup(popup)
          .addTo(map);
      });
    });

    // Switch Tile Styles
    function changeStyle(theme) {
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      map.setStyle(STYLES[theme]);
    }

    // Fly to Coordinates with Smooth Animation
    function flyToCity(coords, zoom) {
      map.flyTo({
        center: coords,
        zoom: zoom,
        pitch: 50,
        bearing: Math.floor(Math.random() * 60) - 30,
        speed: 1.4,
        curve: 1.5,
        essential: true
      });
    }
  </script>
</body>
</html>
